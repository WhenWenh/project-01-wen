trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: KeyVaultVariables
  - name: npm_config_cache
    value: $(Pipeline.Workspace)/.npm

stages:
  - stage: Build
    displayName: "Build backend"
    jobs:
      - job: backend
        displayName: "Build and test backend"
        timeoutInMinutes: 10
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: "Use Java 21"
            inputs:
              versionSpec: "21"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"

          - task: Cache@2
            displayName: "Cache Maven dependencies"
            inputs:
              key: 'maven | "$(Agent.OS)" | backend/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: ~/.m2/repository

          - script: chmod +x ./mvnw
            displayName: "Make Maven wrapper executable"
            workingDirectory: backend

          - script: |
              docker compose up -d postgres

              for i in {1..30}; do
                if docker exec tour-postgres pg_isready -U "$DB_USER" -d "$DB_NAME"; then
                  exit 0
                fi
                sleep 2
              done

              docker compose logs postgres
              exit 1
            displayName: "Start PostgreSQL for backend tests"
            workingDirectory: backend
            env:
              DB_USER: $(db-user)
              DB_PASSWORD: $(db-password)
              DB_NAME: $(db-name)
              DB_PORT: $(db-port)

          - script: ./mvnw -B clean package
            displayName: "Build and test backend"
            workingDirectory: backend
            env:
              DB_USER: $(db-user)
              DB_PASSWORD: $(db-password)
              DB_NAME: $(db-name)
              DB_PORT: $(db-port)
              JWT_SECRET: $(jwt-secret-base64)

          - task: PublishTestResults@2
            displayName: "Publish backend test results"
            inputs:
              testResultsFiles: "backend/target/surefire-reports/TEST-*.xml"
              testRunTitle: "Backend JUnit Tests"
            condition: succeededOrFailed()

          - task: PublishBuildArtifacts@1
            displayName: "Publish backend artifact"
            inputs:
              PathtoPublish: "backend/target"
              ArtifactName: "backend-artifact"
              publishLocation: "Container"

          - script: docker compose down -v
            displayName: "Stop PostgreSQL"
            workingDirectory: backend
            condition: always()
            env:
              DB_USER: $(db-user)
              DB_PASSWORD: $(db-password)
              DB_NAME: $(db-name)
              DB_PORT: $(db-port)

      - job: frontend
        displayName: "Build frontend"
        timeoutInMinutes: 10
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: "Use Node.js 20"
            inputs:
              version: "20.x"
              checkLatest: true

          - script: |
              node --version
              npm --version
              npm install -g npm@10.8.2
              npm --version
            displayName: "Use npm 10.8.2"

          - task: Cache@2
            displayName: "Cache npm dependencies"
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)

          - script: npm ci --cache $(npm_config_cache)
            displayName: "Install frontend dependencies"
            workingDirectory: frontend

          - script: npm run build
            displayName: "Build frontend"
            workingDirectory: frontend

          - task: PublishBuildArtifacts@1
            displayName: "Publish frontend artifact"
            inputs:
              PathtoPublish: "frontend/dist"
              ArtifactName: "frontend-artifact"
              publishLocation: "Container"

  - stage: Release
    displayName: "Release"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: release
        displayName: "Release deployment"
        steps:
          - download: current
            artifact: backend-artifact

          - download: current
            artifact: frontend-artifact

          - task: AzureWebApp@1
            displayName: "Deploy Backend to App Service"
            inputs:
              azureSubscription: "AzureConnection"
              appName: "tourplanner-backend"
              package: "$(Pipeline.Workspace)/backend-artifact/*.jar"
