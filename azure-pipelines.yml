trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: KeyVaultVariables


stages:
  - stage: Build
    displayName: "Build backend"
    jobs:
      - job: backend
        displayName: "Build and test backend"
        timeoutInMinutes: 10
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: "Use Java 21"
            inputs:
              versionSpec: "21"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"

          - task: Cache@2
            displayName: "Cache Maven dependencies"
            inputs:
              key: 'maven | "$(Agent.OS)" | backend/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: ~/.m2/repository

          - script: chmod +x ./mvnw
            displayName: "Make Maven wrapper executable"
            workingDirectory: backend

          - script: ./mvnw -B clean package
            displayName: "Build and test backend"
            workingDirectory: backend
            env:
              DB_USER: $(db-user)
              DB_PASSWORD: $(db-password)
              DB_NAME: $(db-name)
              DB_PORT: $(db-port)
              JWT_SECRET: $(jwt-secret-base64)

          - task: PublishTestResults@2
            displayName: "Publish backend test results"
            inputs:
              testResultsFiles: "backend/target/surefire-reports/TEST-*.xml"
              testRunTitle: "Backend JUnit Tests"
            condition: succeededOrFailed()

  - stage: Release
    displayName: "Release"
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: release_placeholder
        displayName: "Release placeholder"
        steps:
          - script: echo "Release stage placeholder - deployment will be added later."
            displayName: "Release placeholder"
